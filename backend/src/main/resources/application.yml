server:
  port: 8080

spring:
  application:
    name: equipment-reservation

  # H2 文件数据库：数据落盘到 backend/data/，重启不丢
  datasource:
    url: jdbc:h2:file:./data/reservation;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  # H2 文件模式（AUTO_SERVER）不算纯嵌入式库，必须显式打开脚本初始化
  sql:
    init:
      mode: always

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    # 让 data.sql 在 Hibernate 建表之后执行
    defer-datasource-initialization: true

  # H2 Web 控制台：http://localhost:8080/h2-console
  h2:
    console:
      enabled: true
      path: /h2-console
